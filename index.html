<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Asset Management | Corporate Housing Solutions</title>
    <style>
        :root {
            --slate-black: #0F1115; /* Premium Institutional Foundation */
            --charcoal-grey: #1C1F26; /* Bento Box Backgrounds */
            --brushed-gold: #D4AF37; /* Corporate Trust Highlight */
            --muted-gold: #AA841B;
            --pure-white: #FFFFFF;
            --text-body: #94A3B8;
            --border-gold: rgba(212, 175, 55, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--slate-black);
            color: var(--pure-white);
            overflow-x: hidden;
        }

        /* Fixed Navigation Header */
        header {
            background-color: rgba(15, 17, 21, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-gold);
            padding: 1.25rem 8%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--pure-white);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--brushed-gold);
            font-weight: 300;
        }

        nav a {
            color: var(--text-body);
            text-decoration: none;
            margin-left: 2.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--brushed-gold);
        }

        /* Cinema Quality Looping Background Showcase */
        .hero-viewport {
            position: relative;
            height: 75vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
            background-color: #050709;
            overflow: hidden;
        }

        /* High-Definition Architecture Loop - Guaranteed Cross-Browser Delivery */
        .hero-video-render {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.35;
        }

        .hero-shading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(15,17,21,0.98) 35%, rgba(15,17,21,0.5) 100%);
            z-index: 2;
        }

        .hero-text-stack {
            position: relative;
            z-index: 3;
            max-width: 850px;
        }

        .market-badge {
            color: var(--brushed-gold);
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 1.25rem;
            display: inline-block;
            border: 1px solid var(--border-gold);
            padding: 0.35rem 0.75rem;
            background: rgba(212, 175, 55, 0.05);
        }

        .hero-text-stack h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        .hero-text-stack p {
            font-size: 1.2rem;
            color: var(--text-body);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .action-link-gold {
            background: linear-gradient(135deg, var(--brushed-gold) 0%, var(--muted-gold) 100%);
            color: var(--slate-black);
            padding: 1.1rem 2.5rem;
            border-radius: 2px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .action-link-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
        }

        /* Corporate Architecture Bento Grid */
        .content-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 6rem 8%;
        }

        .heading-block {
            margin-bottom: 4.5rem;
        }

        .heading-block h2 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .heading-block p {
            color: var(--brushed-gold);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        .bento-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .bento-item {
            background-color: var(--charcoal-grey);
            border: 1px solid rgba(255,255,255,0.02);
            padding: 3rem;
            border-radius: 4px;
            transition: border-color 0.3s;
        }

        .bento-item:hover {
            border-color: var(--brushed-gold);
        }

        .bento-item.span-two {
            grid-column: span 2;
        }

        .bento-item h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            color: var(--pure-white);
        }

        .bento-item h3 span {
            color: var(--brushed-gold);
        }

        .bento-item p {
            color: var(--text-body);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Strict Regulatory & Governance Banner */
        .regulatory-panel {
            background-color: #13151A;
            border-top: 1px solid var(--border-gold);
            border-bottom: 1px solid var(--border-gold);
            padding: 5rem 8%;
        }

        .regulatory-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4rem;
        }

        .regulatory-text h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .regulatory-text p {
            color: var(--text-body);
            font-size: 1.05rem;
            max-width: 600px;
        }

        .governance-badges {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        .badge-element {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 1.25rem;
            border-left: 3px solid var(--brushed-gold);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Institutional Footprint & Communication Channels */
        footer {
            background-color: var(--slate-black);
            padding: 6rem 8% 3rem 8%;
            border-top: 1px solid rgba(255,255,255,0.01);
        }

        .footer-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
            padding-bottom: 4rem;
        }

        .footer-identity h2 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .footer-identity p {
            color: var(--text-body);
            max-width: 550px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .footer-channel h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brushed-gold);
            margin-bottom: 1.25rem;
        }

        .footer-channel p {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .legal-row {
            max-width: 1400px;
            margin: 0 auto;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #4B5563;
        }

        @media (max-width: 1024px) {
            .bento-layout { grid-template-columns: 1fr; }
            .bento-item.span-two { grid-column: span 1; }
            .regulatory-wrapper { flex-direction: column; align-items: flex-start; }
            .footer-layout { grid-template-columns: 1fr; }
            .hero-text-stack h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">Jackson <span>Asset Management</span></div>
            <nav>
                <a href="#propositions">Framework</a>
                <a href="#governance">Compliance</a>
                <a href="#corporate">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Video loop wrapper built to force continuous cross-device play state -->
    <section class="hero-viewport">
        <video class="hero-video-render" autoplay loop muted playsinline preload="auto">
