<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Asset Management | Corporate Housing Solutions</title>
    <style>
        :root {
            --slate-black: #0F1115; /* Ultra premium dark foundation */
            --charcoal-grey: #1C1F26; /* Contrast sections */
            --brushed-gold: #D4AF37; /* Trust, premium authority color */
            --muted-gold: #AA841B;
            --pure-white: #FFFFFF;
            --text-body: #94A3B8;
            --border-color: rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--slate-black);
            color: var(--pure-white);
            overflow-x: hidden;
        }

        /* Premium Floating Navigation Header */
        header {
            background-color: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 8%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--pure-white);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--brushed-gold);
            font-weight: 300;
        }

        nav a {
            color: var(--text-body);
            text-decoration: none;
            margin-left: 2.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--brushed-gold);
        }

        /* Cinematic Video Hero Section */
        .hero-section {
            position: relative;
            height: 85vh;
            display: flex;
            align-items: center;
            padding: 0 8%;
            overflow: hidden;
        }

        .hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.35; /* Blends flawlessly into dark mode background */
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(15,17,21,0.95) 40%, rgba(15,17,21,0.4) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 800px;
        }

        .geo-tag {
            color: var(--brushed-gold);
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-body);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--brushed-gold) 0%, var(--muted-gold) 100%);
            color: var(--slate-black);
            padding: 1.1rem 2.5rem;
            border-radius: 2px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.35);
        }

        /* Premium Bento Grid Portfolio & Strategy Section */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 7rem 8%;
        }

        .section-header {
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--brushed-gold);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.85rem;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .bento-card {
            background-color: var(--charcoal-grey);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 3rem;
            border-radius: 4px;
            transition: border 0.3s;
        }

        .bento-card:hover {
            border-color: var(--brushed-gold);
        }

        .bento-card.wide {
            grid-column: span 2;
        }

        .bento-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--pure-white);
        }

        .bento-card h3 span {
            color: var(--brushed-gold);
        }

        .bento-card p {
            color: var(--text-body);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Strict Compliance Anchor Bar */
        .compliance-bar {
            background-color: #14171D;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 5rem 8%;
        }

        .compliance-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4rem;
        }

        .compliance-text {
            max-width: 600px;
        }

        .compliance-text h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .compliance-text p {
            color: var(--text-body);
            font-size: 1rem;
        }

        .framework-badges {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .badge-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 1.25rem;
            border-left: 3px solid var(--brushed-gold);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Institutional Contact Footer */
        footer {
            background-color: var(--slate-black);
            padding: 6rem 8% 3rem 8%;
            border-top: 1px solid rgba(255,255,255,0.02);
        }

        .footer-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
            padding-bottom: 4rem;
        }

        .footer-brand h2 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .footer-brand p {
            color: var(--text-body);
            max-width: 500px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .footer-contact h4 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brushed-gold);
            margin-bottom: 1.5rem;
        }

        .footer-contact p {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .copyright-bar {
            max-width: 1400px;
            margin: 0 auto;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #4B5563;
        }

        @media (max-width: 1024px) {
            .bento-grid { grid-template-columns: 1fr; }
            .bento-card.wide { grid-column: span 1; }
            .compliance-wrapper { flex-direction: column; align-items: flex-start; }
            .footer-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">Jackson <span>Asset Management</span></div>
            <nav>
                <a href="#propositions">Partnerships</a>
                <a href="#governance">Governance</a>
                <a href="#corporate">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section leveraging premium background looping property stock -->
    <section class="hero-section">
        <video class="hero-video-bg" autoplay loop muted playsinline poster="https://unsplash.com">
            <source src="https://mixkit.co" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
